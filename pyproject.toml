# Python research tools. The CUDA library is built and installed by CMake.
[project]
name = "varblockspmm-research-tools"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# Pin the dependency closure from the validated Python 3.13 environment.
paper = [
    "certifi==2026.4.22",
    "charset-normalizer==3.3.2",
    "contourpy==1.3.1",
    "cycler==0.11.0",
    "fonttools==4.55.3",
    "idna==3.7",
    "kiwisolver==1.4.8",
    "matplotlib==3.10.0",
    "numpy==2.1.3",
    "packaging==24.2",
    "pillow==11.1.0",
    "pyparsing==3.2.0",
    "python-dateutil==2.9.0.post0",
    "requests==2.32.3",
    "scipy==1.15.3",
    "six==1.17.0",
    "urllib3==2.3.0",
]

[tool.uv]
package = false
default-groups = ["paper"]
